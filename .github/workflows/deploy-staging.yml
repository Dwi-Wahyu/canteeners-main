name: Build and Deploy Staging (Main App)

on:
  push:
    branches: [staging]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: Staging
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v3

      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Build and Push App
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          target: runner
          tags: ghcr.io/dwi-wahyu/canteeners-main:staging
          cache-from: type=registry,ref=ghcr.io/dwi-wahyu/canteeners-main:cache-staging
          cache-to: type=registry,ref=ghcr.io/dwi-wahyu/canteeners-main:cache-staging,mode=max
          build-args: |
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
            NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
            NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
            NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
            NEXT_PUBLIC_BACKEND_URL=${{ secrets.NEXT_PUBLIC_BACKEND_URL }}
            NEXTAUTH_URL=${{ secrets.NEXTAUTH_URL }}

      - name: Build and Push Migrator
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          target: migrator
          tags: ghcr.io/dwi-wahyu/canteeners-migrator:staging
          cache-from: type=registry,ref=ghcr.io/dwi-wahyu/canteeners-migrator:cache-staging
          cache-to: type=registry,ref=ghcr.io/dwi-wahyu/canteeners-migrator:cache-staging,mode=max
          build-args: |
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
            NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
            NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
            NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
            NEXT_PUBLIC_BACKEND_URL=${{ secrets.NEXT_PUBLIC_BACKEND_URL }}
            NEXTAUTH_URL=${{ secrets.NEXTAUTH_URL }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: Staging
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        timeout-minutes: 20
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          timeout: 20m
          command_timeout: 15m
          script: |
            export XDG_RUNTIME_DIR=/run/user/$(id -u)

            # Cek disk dulu — batalkan jika > 80%
            USAGE=$(df / | awk 'NR==2 {print $5}' | tr -d '%')
            if [ "$USAGE" -gt 80 ]; then
              echo "❌ Disk usage ${USAGE}% — bersihkan dulu"
              podman image prune -f
            fi

            podman login ghcr.io -u dwi-wahyu -p ${{ secrets.GHCR_TOKEN }}

            # Pull images terbaru
            podman pull ghcr.io/dwi-wahyu/canteeners-main:staging || exit 1
            podman pull ghcr.io/dwi-wahyu/canteeners-migrator:staging || exit 1

            # Restart pod dengan image terbaru
            podman kube down /var/www/canteeners/podman/staging/pod.yaml
            podman kube play /var/www/canteeners/podman/staging/pod.yaml

            # Tunggu DB siap
            sleep 10

            # Jalankan migration
            podman run --rm \
              --pod canteeners-staging-pod \
              -e DATABASE_URL='postgresql://canteeners_staging:canteeners_staging123@localhost:5432/canteeners_staging?schema=public' \
              ghcr.io/dwi-wahyu/canteeners-migrator:staging \
              bunx prisma migrate deploy

            # Bersihkan image lama setelah deploy sukses
            podman image prune -f
